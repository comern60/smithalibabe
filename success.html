<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <title>SUCCESSFUL</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui,
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #182230;
        background: #f5f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 15% 10%, #e5edff 0, transparent 40%),
          radial-gradient(ellipse at 90% 90%, #e9e5ff 0, transparent 36%),
          #f5f7fb;
      }

      .card {
        width: min(100%, 440px);
        padding: 42px;
        border: 1px solid #e9edf4;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 20px 60px rgb(32 48 80 / 10%);
      }

      .success-icon {
        display: grid;
        width: 56px;
        height: 56px;
        margin-bottom: 24px;
        place-items: center;
        border-radius: 50%;
        color: #15803d;
        background: #dcfce7;
        font-size: 28px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.8px;
      }

      p {
        margin: 10px 0 30px;
        color: #667085;
        font-size: 15px;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        color: #4f46e5;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      a:focus-visible {
        outline: 3px solid #a5b4fc;
        outline-offset: 3px;
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        .card {
          padding: 30px 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" aria-labelledby="success-title">
      <div class="success-icon" aria-hidden="true">✓</div>
      <h1 id="success-title">Successful</h1>
      <p>
        Your account information has been updated.
      </p>
      <a href="https://www.webmail.com">← Back to contact form</a>
    </main>
  </body>
</html>
